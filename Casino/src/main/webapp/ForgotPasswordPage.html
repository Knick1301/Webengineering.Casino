<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="html-style.css"/>
  </head>
  <body>
    <div class="loginPage">
      <div class="pageOverlay">
        <div class="loginCardWrapper">
          <div class="loginCard">
            <div class="pa-6">
              <div class="text-center mb-8">
                <div class="logoShell mb-4">
                  <img src="images/spade.webp" alt="Casino Logo" />
                </div>

                <div class="brandWrap">
                  <div class="brandPrefix"></div>
                  <div class="brandName">Passwort zurücksetzen</div>
                </div>
              </div>

              <form
                id="forgotPasswordForm"
                action="ForgotPasswordServlet"
                method="POST"
              >
                <div class="formPanel">
                  <div class="formTitle mb-3">
                    Neues Passwort festlegen
                  </div>

                  <div id="errorBox" class="errorBox">
                    Fehler bei der Passwortänderung.
                  </div>

                  <input
                    type="text"
                    id="resetUsername"
                    name="resetUsername"
                    class="customInput mb-3"
                    placeholder="Benutzername"
                    required
                  />
                  <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    class="customInput mb-3"
                    placeholder="Passwort"
                    required
                  />
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="customInput mb-4"
                    placeholder="Passwort wiederholen"
                    required
                  />

                  <button type="submit" id="pasBtn" class="loginBtn" disabled>
                    Neues Passwort festlegen
                  </button>

                  <a href="LoginPage.html" class="forgotPasswordLink mt-3 block text-center">
                    Zurück zur Anmeldung
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const usernameInput = document.getElementById("resetUsername");
      const newPassword = document.getElementById("newPassword");
      const confirmInput = document.getElementById("confirmPassword");
      const passwordBtn = document.getElementById("pasBtn");

      function validateForm() {
        const username = usernameInput.value.trim();
        const password = newPassword.value.trim();
        const confirm = confirmInput.value.trim();

        if (username.length > 0 && password.length > 0 && confirm.length > 0) {
          passwordBtn.disabled = false;
        } else {
          passwordBtn.disabled = true;
        }
      }

      usernameInput.addEventListener("input", validateForm);
      newPassword.addEventListener("input", validateForm);
      confirmInput.addEventListener("input", validateForm);

      const urlParams = new URLSearchParams(window.location.search);
      const errorBox = document.getElementById("errorBox");

      if (urlParams.get("error") === "mismatch") {
        errorBox.innerText = "Die Passwörter stimmen nicht überein.";
        errorBox.style.display = "block";
      } else if (urlParams.get("error") === "doesnotexist") {
        errorBox.innerText = "Dieser Benutzername existiert nicht.";
        errorBox.style.display = "block";
      }
    </script>
  </body>
</html>
