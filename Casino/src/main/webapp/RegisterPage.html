<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="html-style.css"/>
  </head>
  <body>
    <div class="loginPage">
      <div class="pageOverlay">
        <div class="loginCardWrapper">
          <div class="loginCard">
            <div class="pa-6">
              <div class="text-center mb-8">
                <div class="logoShell mb-4">
                  <img src="images/spade.webp" alt="Casino Logo" />
                </div>

                <div class="brandWrap">
                  <div class="brandPrefix"></div>
                  <div class="brandName">Registrierung</div>
                </div>
              </div>

              <form id="registerForm" action="RegisterServlet" method="POST">
                <div class="formPanel">
                  <div class="formTitle mb-3">
                    Account erstellen
                  </div>

                  <div id="errorBox" class="errorBox">
                    Fehler bei der Registrierung.
                  </div>

                  <input
                    type="text"
                    id="regUsername"
                    name="regUsername"
                    class="customInput mb-3"
                    placeholder="Gewünschter Benutzername"
                    required
                  />
                  <input
                    type="password"
                    id="regPassword"
                    name="regPassword"
                    class="customInput mb-3"
                    placeholder="Passwort"
                    required
                  />
                  <input
                    type="password"
                    id="regPasswordConfirm"
                    name="regPasswordConfirm"
                    class="customInput mb-4"
                    placeholder="Passwort wiederholen"
                    required
                  />

                  <button type="submit" id="registerBtn" class="loginBtn">
                    Registrieren
                  </button>

                  <a href="LoginPage.html" class="forgotPasswordLink mt-3 block text-center">
                    Schon einen Account? Zurück zur Anmeldung
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const usernameInput = document.getElementById("regUsername");
      const passwordInput = document.getElementById("regPassword");
      const confirmInput = document.getElementById("regPasswordConfirm");
      const registerBtn = document.getElementById("registerBtn");

      function validateForm() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const confirm = confirmInput.value.trim();

        if (username.length > 0 && password.length > 0 && confirm.length > 0) {
          registerBtn.disabled = false;
        } else {
          registerBtn.disabled = true;
        }
      }

      usernameInput.addEventListener("input", validateForm);
      passwordInput.addEventListener("input", validateForm);
      confirmInput.addEventListener("input", validateForm);

      const urlParams = new URLSearchParams(window.location.search);
      const errorBox = document.getElementById("errorBox");

      if (urlParams.get("error") === "mismatch") {
        errorBox.innerText = "Die Passwörter stimmen nicht überein.";
        errorBox.style.display = "block";
      } else if (urlParams.get("error") === "exists") {
        errorBox.innerText = "Dieser Benutzername ist leider schon vergeben.";
        errorBox.style.display = "block";
      }
    </script>
  </body>
</html>
