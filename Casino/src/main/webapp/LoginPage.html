<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="html-style.css" />
  </head>
  <body>
    <div class="loginPage">
      <div class="pageOverlay">
        <div class="loginCardWrapper">
          <div class="loginCard">
            <div class="pa-6">
              <div class="text-center mb-8">
                <div class="logoShell mb-4">
                  <img src="images/spade.webp" alt="Casino Logo" />
                </div>

                <div class="brandWrap">
                  <div class="brandPrefix"></div>
                  <div class="brandName">Casino</div>
                </div>
              </div>

              <form id="loginForm" action="LoginServlet" method="POST">
                <div class="formPanel">
                  <div class="formTitle mb-3">Anmeldung</div>
                  <div id="errorBox" class="errorBox">
                    Benutzername oder Passwort falsch.
                  </div>

                  <input
                    type="text"
                    id="username"
                    name="loginUsername"
                    class="customInput mb-3"
                    placeholder="Benutzername"
                    required
                  />
                  <input
                    type="password"
                    id="password"
                    name="loginPassword"
                    class="customInput mb-3"
                    placeholder="Passwort"
                    required
                  />
                  <div class="text-right mb-4">
                    <a href="ForgotPasswordPage.html" class="forgotPasswordLink"
                      >Passwort vergessen</a
                    >
                  </div>
                  <button type="submit" id="loginBtn" class="loginBtn" disabled>
                    Login
                  </button>

                  <a
                    href="RegisterPage.html"
                    class="forgotPasswordLink mt-3 block text-center"
                  >
                    Noch keinen Account? Jetzt registrieren
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");

      function validateForm() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if (username.length > 0 && password.length > 0) {
          loginBtn.disabled = false;
        } else {
          loginBtn.disabled = true;
        }
      }

      usernameInput.addEventListener("input", validateForm);
      passwordInput.addEventListener("input", validateForm);

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("error") === "true") {
        const errorBox = document.getElementById("errorBox");
        errorBox.style.display = "block";
      }
    </script>
  </body>
</html>
